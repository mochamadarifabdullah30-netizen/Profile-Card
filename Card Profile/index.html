<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="profile-card">

        <div class="info-box">
            <img src="arip parker.jpeg" alt="">

            <div class="info">
                <h2>Arip Parker</h2>
                <p>Web Developer</p>
            </div> 
        </div>

        <div class="numbers-grid">
            <div class="box">
                <p>6</p>
                <p>Post</p>
            </div>

            <div class="box">
                <p>76k</p>
                <p>Followers</p>
            </div>

            <div class="">
                <p>114</p>
                <p>Following</p>
            </div>
              
        </div>

        <div class="btn-box">
            <button class="Follow">Follow</button>
            <button class="Message">Message</button>

        </div>

    </div>
</body>
</html>
